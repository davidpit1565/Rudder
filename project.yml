# XcodeGen spec — the declarative source of truth for Rudder.xcodeproj.
#
# The committed Rudder.xcodeproj is generated from this file. If the project ever
# needs regenerating (merge conflict, Xcode upgrade), install XcodeGen and run:
#
#     xcodegen generate
#
name: Rudder
options:
  bundleIdPrefix: com.rudder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  RudderKit:
    path: Packages/RudderKit

targets:
  Rudder:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: RudderKit
        product: RudderCore
      - package: RudderKit
        product: RudderFlow
      - target: RudderWidgetExtension
        embed: true
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        # INFOPLIST_FILE comes from Shared.xcconfig. Deliberately not using
        # XcodeGen's `info:` block, which would generate a plist over the top of
        # the real one.
        GENERATE_INFOPLIST_FILE: NO
        # Shared with RudderWidgetExtension -- see Config/Rudder.entitlements
        # and App/Services/WidgetBridge.swift.
        CODE_SIGN_ENTITLEMENTS: Config/Rudder.entitlements

  RudderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RudderAppTests
    dependencies:
      - target: Rudder
      - package: RudderKit
        product: RudderCore
      - package: RudderKit
        product: RudderFlow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  RudderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/RudderUITests
    dependencies:
      - target: Rudder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  RudderWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      # Shared with the app target -- Darwin-only App Group file I/O can't live
      # in RudderKit, which also has to build on Linux CI. See the file itself.
      - path: App/Services/WidgetBridge.swift
    dependencies:
      - package: RudderKit
        product: RudderCore
      - package: RudderKit
        product: RudderFlow
    settings:
      base:
        PRODUCT_NAME: RudderWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.rudder.app.widget
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Config/RudderWidgetExtension-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/RudderWidgetExtension.entitlements
        CODE_SIGN_STYLE: Automatic

schemes:
  Rudder:
    build:
      targets:
        Rudder: all
        RudderWidgetExtension: all
    run:
      config: Debug
      storeKitConfiguration: Config/Rudder.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RudderTests
        - RudderUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
