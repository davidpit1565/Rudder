# XcodeGen spec — the declarative source of truth for Rudder.xcodeproj.
#
# The committed Rudder.xcodeproj is generated from this file. If the project ever
# needs regenerating (merge conflict, Xcode upgrade), install XcodeGen and run:
#
#     xcodegen generate
#
name: Rudder
options:
  bundleIdPrefix: com.rudder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  RudderKit:
    path: Packages/RudderKit

targets:
  Rudder:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: RudderKit
        product: RudderCore
      - package: RudderKit
        product: RudderFlow
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        # INFOPLIST_FILE comes from Shared.xcconfig. Deliberately not using
        # XcodeGen's `info:` block, which would generate a plist over the top of
        # the real one.
        GENERATE_INFOPLIST_FILE: NO

  RudderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RudderAppTests
    dependencies:
      - target: Rudder
      - package: RudderKit
        product: RudderCore
      - package: RudderKit
        product: RudderFlow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  RudderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/RudderUITests
    dependencies:
      - target: Rudder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Rudder:
    build:
      targets:
        Rudder: all
    run:
      config: Debug
      storeKitConfiguration: Config/Rudder.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RudderTests
        - RudderUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
