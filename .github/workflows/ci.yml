name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. A new push supersedes the one in flight instead of paying
# for both, and a PR no longer triggers a duplicate push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No test-only code or credentials can reach a shipping build
        run: python3 Scripts/check-release-hygiene.py

  decidekit:
    name: DecideKit (engines and pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Test
        working-directory: Packages/DecideKit
        run: swift test

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Install
        working-directory: Backend
        run: npm ci
      - name: Typecheck and test
        working-directory: Backend
        run: npm test
      - name: Fail if the Swift contract fixture drifted
        run: git diff --exit-code Packages/DecideKit/Tests/DecideCoreTests/Fixtures/backend_contract.json

  app:
    name: iOS app (${{ matrix.device }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # The largest current phone and the smallest supported one: layout has to
        # hold at both ends.
        device: ["iPhone 16", "iPhone SE (3rd generation)"]
    steps:
      - uses: actions/checkout@v4

      # Naming a device in the destination assumes the runner happens to have one
      # instantiated, which is not guaranteed and varies between images. Create
      # the device we want against whatever iOS runtime is installed.
      - name: Create the simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          runtime=$(xcrun simctl list runtimes --json | python3 -c "
          import json, sys
          runtimes = [
              r for r in json.load(sys.stdin)['runtimes']
              if r.get('isAvailable') and r.get('platform') == 'iOS'
          ]
          if not runtimes:
              sys.exit('No iOS simulator runtime is installed on this runner')
          print(sorted(runtimes, key=lambda r: r['version'])[-1]['identifier'])
          ")
          echo "Using runtime: $runtime"
          udid=$(xcrun simctl create "ci-${{ matrix.device }}" "${{ matrix.device }}" "$runtime")
          echo "Created ${{ matrix.device }} as $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Decide.xcodeproj \
            -scheme Decide \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  release-config:
    name: iOS Release build (production config)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The Decide scheme's TestAction is pinned to Debug (see project.yml and
      # Decide.xcscheme), and Release.xcconfig sets ENABLE_TESTABILITY = NO on
      # purpose -- a release build is not meant to carry test hooks. So this job
      # proves the one thing a test run can't: that Release actually compiles and
      # that it resolves to the real production host, not Debug's build settings.
      - name: Resolve Release's DECIDE_API_BASE_URL and reject a local host
        run: |
          set -euo pipefail
          resolved=$(xcodebuild -project Decide.xcodeproj -target Decide -configuration Release -showBuildSettings -skipPackagePluginValidation \
            | sed -nE 's/^[[:space:]]*DECIDE_API_BASE_URL = (.*)$/\1/p')
          echo "Release DECIDE_API_BASE_URL resolves to: $resolved"
          if [ "$resolved" != "https://decide-mu-navy.vercel.app" ]; then
            echo "::error::Expected https://decide-mu-navy.vercel.app, got '$resolved'"
            exit 1
          fi
          case "$resolved" in
            *localhost*|*127.0.0.1*|*0.0.0.0*)
              echo "::error::Release resolved to a local host: $resolved"
              exit 1
              ;;
          esac

      - name: Confirm Debug does not also resolve to the production host
        run: |
          set -euo pipefail
          resolved=$(xcodebuild -project Decide.xcodeproj -target Decide -configuration Debug -showBuildSettings -skipPackagePluginValidation \
            | sed -nE 's/^[[:space:]]*DECIDE_API_BASE_URL = (.*)$/\1/p')
          echo "Debug DECIDE_API_BASE_URL resolves to: $resolved"
          if [ "$resolved" = "https://decide-mu-navy.vercel.app" ]; then
            echo "::error::Debug also resolves to production -- Debug/Release are no longer isolated"
            exit 1
          fi

      - name: Build the app target for Release
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Decide.xcodeproj \
            -scheme Decide \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ReleaseBuild \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      # Belt and braces: the setting above is what feeds Info.plist, but this
      # reads the value back out of the actual built bundle, so the check is
      # against what a device would really load, not just the build setting.
      - name: Verify the built Release app's Info.plist carries the production URL
        run: |
          set -euo pipefail
          app_path=$(find ReleaseBuild/Build/Products -maxdepth 2 -name "Decide.app" -print -quit)
          if [ -z "$app_path" ]; then
            echo "::error::Could not find built Decide.app under ReleaseBuild/Build/Products"
            exit 1
          fi
          value=$(/usr/libexec/PlistBuddy -c "Print :DecideAPIBaseURL" "$app_path/Info.plist")
          echo "Built app Info.plist DecideAPIBaseURL: $value"
          if [ "$value" != "https://decide-mu-navy.vercel.app" ]; then
            echo "::error::Built Release app's Info.plist has DecideAPIBaseURL='$value'"
            exit 1
          fi
